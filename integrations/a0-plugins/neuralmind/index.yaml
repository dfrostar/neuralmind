title: NeuralMind — Persistent Codebase Memory
description: >-
  Persistent memory for AI coding agents over MCP. NeuralMind indexes a codebase
  into a code graph, learns which files belong together from real usage, and
  returns ranked context: the gold file on 40 of 40 public-benchmark queries,
  against 32 of 40 for keyword ripgrep, at 31-67× fewer tokens. Local by
  default: no telemetry, no repository content sent (one public model download;
  LLM seeding is opt-in). Point Agent Zero's MCP config at `neuralmind-mcp`.
github: https://github.com/dfrostar/neuralmind
tags:
  - mcp
  - code
  - context
  - local-first
  - rag
