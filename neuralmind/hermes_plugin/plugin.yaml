name: neuralmind
version: "4.9.2" # x-release-please-version
description: "NeuralMind code memory: related files and decisions added to every turn, and the last session's recap to a session's first, with no tool call."
author: NeuralMind
license: MIT
homepage: https://github.com/dfrostar/neuralmind
# The version this plugin was tested against; Hermes skips it on older ones.
requires_hermes: ">=0.21.5"
provides_hooks:
  - pre_llm_call
  - post_tool_call
tags:
  - memory
  - code-intelligence
  - context
