# GitHub Pages (Jekyll) config for neuralmind.uk.
#
# Purpose: give every rendered markdown page (docs/wiki/*, docs/*.md,
# docs/use-cases/*, benchmarks/public.md, …) the site's dark chrome via
# _layouts/default.html, so /wiki/Home matches index.html instead of the
# stock Primer theme. HTML files without front matter (index.html,
# about.html, benchmarks/index.html) are static files — Jekyll copies
# them through untouched.
#
# The wiki .md files themselves stay front-matter-free on purpose: the
# sync-wiki workflow mirrors them into the GitHub Wiki, where a front
# matter block would render as literal text. GitHub Pages' always-on
# jekyll-optional-front-matter plugin turns them into pages anyway, and
# the defaults block below assigns the layout.

title: NeuralMind
url: "https://docs.neuralmind.uk"
description: >-
  Persistent, local-first codebase memory for AI coding agents — a code
  graph and a synapse layer that learns your codebase, serving compact
  context to Claude Code, Codex, Cursor and any MCP client.

# These are enabled by default on GitHub Pages; declared explicitly so a
# local `jekyll build` behaves the same as the Pages build.
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-default-layout
  - jekyll-readme-index

defaults:
  - scope:
      path: ""
    values:
      layout: default

  # Two wiki pages open with an HTML comment, so jekyll-titles-from-headings
  # finds no heading on line 1 and they rendered as "NeuralMind Docs" — the
  # site's two most important pages. Name them here: front matter would show
  # as text in the GitHub Wiki mirror.
  - scope:
      path: "wiki/Home.md"
    values:
      title: "Docs: Codebase Memory for AI Coding Agents"
      description: >-
        NeuralMind docs: persistent codebase memory for Claude Code, Codex,
        Cursor, Hermes and any MCP client. Setup, CLI, architecture,
        benchmarks and use cases.
  - scope:
      path: "wiki/CLI-Reference.md"
    values:
      title: "CLI Reference"
      description: >-
        Every neuralmind command, flag, environment variable and exit code:
        build, query, watch, serve, eval, doctor, install-hooks, the MCP
        server and the team commands.
  - scope:
      path: "releases/RELEASE_NOTES_v1.4.0.md"
    values:
      title: "NeuralMind v1.4.0 release notes"

  # Working notes and social drafts: public in the repo, not pages anyone
  # should land on from search. The layout emits robots noindex for these.
  - scope:
      path: "social"
    values:
      noindex: true
  - scope:
      path: "specs/LOCAL-API-PR1-SESSION-PROMPT.md"
    values:
      noindex: true
  - scope:
      path: "specs/SEO-2026-PLAN.md"
    values:
      noindex: true
  - scope:
      path: "specs/SESSION_HANDOFF_2026-08-05.md"
    values:
      noindex: true
