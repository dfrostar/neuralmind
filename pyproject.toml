[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralmind"
version = "3.7.1"
description = "Persistent memory for AI coding agents. Your agent learns your codebase the way a senior engineer would — what files go together, what you usually edit next, what patterns matter. Works with Claude Code, Cursor, Cline, Continue, and any MCP-compatible agent. 100% local. Side effect: 12-50× cheaper code questions."
readme = "README.md"
license = "MIT AND LicenseRef-NeuralMind-Commercial"
authors = [
    { name = "Darren Frost", email = "hello@neuralmind.uk" }
]
maintainers = [
    { name = "Darren Frost", email = "hello@neuralmind.uk" }
]
keywords = [
    "ai-coding-agent",
    "agent-memory",
    "persistent-memory",
    "context-compression",
    "token-reduction",
    "semantic-code-search",
    "code-intelligence",
    "code-graph",
    "tree-sitter",
    "knowledge-graph",
    "hebbian-learning",
    "synapse-layer",
    "secret-scanning",
    "credential-redaction",
    "secret-detection",
    "progressive-context-disclosure",
    "intent-detection",
    "code-scoring",
    "health-check",
    "mcp",
    "mcp-server",
    "claude-code",
    "cursor",
    "cline",
    "codex",
    "local-first",
    "rag",
    "llm-tools",
    "developer-tools",
    "team-memory",
    "impact-analysis",
    "code-drift-detection",
    "pre-commit-hook",
    "pattern-consistency",
    "compliance-annotations",
    "control-mapping",
    "audit-evidence",
    "content-ingestion",
    "incremental-indexing",
    "markdown-corpus-search",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "toml>=0.10",
    # Floor is a security floor: 1.28.1 is the first release clear of
    # CVE-2026-59950 (GHSA-vj7q-gjh5-988w). <2: the 2.0 SDK removes the
    # low-level Server list_tools/call_tool decorator API that mcp_server.py
    # registers tools with; lift the cap only when the server is migrated to
    # the 2.x handler API.
    "mcp>=1.28.1,<2",
    # Tier 2: license signing, encryption (Ed25519 sign/verify only).
    # Security floor: 50.0.0 is the first release clear of every advisory
    # open against the 41.x-49.x range this floor used to admit — the newest
    # being CVE-2026-69247 (GHSA-g6cj-pr64-35w5, fixed 50.0.0). The Ed25519
    # API used by tier2/ is unchanged since 41.x, so the bump is floor-only.
    "cryptography>=50.0.0",
    # Security floor: 2.4.0 clears CVE-2024-3772 (GHSA-mr82-8j83-vxmv, ReDoS),
    # which affects every 2.0.0-2.3.x release the previous floor admitted.
    "pydantic>=2.4.0",
    # Vector backend — platform-gated so a base `pip install neuralmind` always
    # resolves to prebuilt wheels (no Rust/C++ toolchain needed):
    #   * the ChromaDB-free TurboQuant/ONNX stack is the default WHERE turbovec
    #     publishes wheels — Linux (manylinux_2_28 x86_64/aarch64), Apple Silicon
    #     (macOS arm64), and Windows x86_64;
    #   * on platforms turbovec has no wheel for (notably Intel macOS x86_64 and
    #     Windows ARM), ChromaDB is installed instead as the fallback backend, so
    #     the default install still works out of the box there.
    # `auto` backend selection then prefers turbovec when present, else chroma.
    # NOTE: env markers can't distinguish musl from glibc, so Alpine/musl (and
    # pre-2.28 glibc) Linux still resolve to turbovec and need a toolchain or
    # `pip install "neuralmind[chromadb]"`; use a glibc base image (python:slim)
    # rather than python:alpine. See docs/prd/chromadb-free-by-default.md.
    # Deliberately uncapped across the 1.0 major. turbovec 1.0.0 stops decoding
    # pre-v5 indexes, which is a real break — but it is handled at runtime, not
    # by pinning: _load_index quarantines an index it cannot read to
    # `index.tvim.stale` and embed_nodes escalates to force=True so the index is
    # rebuilt from the surviving SQLite rows (see #443). 1.0.0 signals this as
    # OSError, which is exactly what that handler catches, so the v3 fixtures
    # still committed under tests/fixtures/*/graphify-out/neuralmind_turbovec/
    # are recovered rather than fatal. A `<1` cap here would freeze every
    # installation on the 0.x line to paper over a case the code already
    # handles; if a future major breaks something recovery cannot absorb, cap
    # it then, against that evidence.
    "turbovec>=0.7; (platform_system == 'Linux') or (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
    "onnxruntime>=1.16; (platform_system == 'Linux') or (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
    "tokenizers>=0.15; (platform_system == 'Linux') or (platform_system == 'Darwin' and platform_machine == 'arm64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
    # Security floor: 1.22 clears CVE-2021-34141 (GHSA-fpfv-jqm9-f5jm) and
    # CVE-2021-33430 (GHSA-6p56-wp2h-9hxr), both of which the 1.20/1.21 range
    # the previous floor admitted is still flagged for.
    "numpy>=1.22",
    # Fallback vector backend on platforms without a turbovec wheel (the De
    # Morgan complement of the turbovec marker — PEP 508 has no unary `not`).
    "chromadb>=0.4.0; platform_system != 'Linux' and (platform_system != 'Darwin' or platform_machine != 'arm64') and (platform_system != 'Windows' or platform_machine != 'AMD64')",
    # Built-in graph backend: parse a project into a graphify-compatible
    # graph.json with no external graphify install. See neuralmind/graphgen.py.
    # Python + TypeScript + Go + Rust + Java + C + C++ + C# + Ruby + PHP grammars
    # are bundled so multi-language indexing works out of the box; the
    # SUPPORTED_SUFFIXES seam registers more.
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-php>=0.22.0"
]

[project.optional-dependencies]
# Kept as an empty extra so existing `pip install "neuralmind[mcp]"` commands
# in user docs, blog posts, and CI configs keep resolving cleanly. The mcp
# package is now a base dependency.
mcp = []
# Opt-in ChromaDB backend. As of v0.29.0 the ChromaDB-free turbovec/ONNX stack
# is the default install; install this extra (and set `backend: graph` in
# neuralmind-backend.yaml, or pass backend="graph") to use ChromaDB instead.
chromadb = [
    "chromadb>=0.4.0",
]
# Back-compat alias: the turbovec/ONNX stack is now a base dependency, so this
# extra is empty. Existing `pip install "neuralmind[turbovec]"` commands keep
# resolving (same pattern as the `mcp` extra).
turbovec = []
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "black>=26.3.1",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=4.6.0"
]
all = [
    "neuralmind[mcp,chromadb,dev]"
]

[project.scripts]
neuralmind = "neuralmind.cli:main"
neuralmind-mcp = "neuralmind.mcp_server:main"
neuralmind-daemon = "neuralmind.daemon:main"

[project.urls]
Homepage = "https://neuralmind.uk"
Documentation = "https://docs.neuralmind.uk/wiki/Home"
Repository = "https://github.com/dfrostar/neuralmind.git"
Issues = "https://github.com/dfrostar/neuralmind/issues"
Changelog = "https://github.com/dfrostar/neuralmind/releases"
Security = "https://github.com/dfrostar/neuralmind/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
# Bundle the demo fixture (small sample project + pre-built graph.json)
# so `pip install neuralmind && neuralmind demo` works without a git
# checkout or graphify install. Hatch already includes Python files
# under the package, but JSON/Markdown need an explicit pattern.
packages = ["neuralmind"]
include = [
    "neuralmind/demo_data/**",
    "neuralmind/web/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "neuralmind/**/*.py",
    "neuralmind/demo_data/**",
    "neuralmind/web/**",
    "scripts/**",
    "docker-compose.yml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md"
]

# PyPI Trusted Publishing Configuration
# To enable trusted publishing on PyPI:
# 1. Go to https://pypi.org/manage/project/neuralmind/settings/publishing/
# 2. Add a new trusted publisher with:
#    - Owner: dfrostar
#    - Repository: neuralmind
#    - Workflow: release.yml
#    - Environment: pypi

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.demo-venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "RET", # flake8-return
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # function call in argument defaults
    "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"neuralmind/__init__.py" = ["E402"]  # telemetry setup must run before imports
"tests/**/*.py" = ["S101", "F841", "PT011", "PT012", "N802"]  # allow assert and test patterns
"evals/**/*.py" = ["E402", "F841"]  # sys.path manipulation + eval scripts


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
branch = true
source = ["neuralmind"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
