name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger for branches whose pull_request events can't fire —
  # release-please force-pushes its release branch with GITHUB_TOKEN, and
  # GitHub's anti-recursion guard suppresses workflow runs for those pushes,
  # so the release PR otherwise shows these checks as never-started (#98).
  workflow_dispatch:
  # A merge queue tests each PR on top of the ones queued ahead of it; its
  # required checks must run on this event or the queue waits forever.
  merge_group:

# A new push to a PR cancels that PR's older run: the Windows job alone takes
# ~25 minutes, and a stale result is never the one that decides the merge.
# Every other run (pushes to main, dispatches, merge-queue entries) gets a
# group of its own: a shared group holds one running and one pending run, and
# a third arrival would silently replace the pending one, losing that CI run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token by default; a job that needs more declares its own
# permissions: block, which replaces this one for that job.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Lint with Ruff
        run: ruff check .

      # ruff has no unreachable-code rule; this is how doctor's exit 1 was lost.
      - name: Check for unreachable code
        run: python scripts/check_unreachable.py

      # Scripts nothing runs rot silently (scripts/test_self_hosted.sh did).
      # shellcheck ships on the ubuntu runner image.
      - name: Lint shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows runners pay a per-commit fsync cost the synapse tests are bound
    # by; the same suite that takes ~4 min on Linux takes 30 min there on a
    # fast-disk runner and 43 min on a slow one (#649: every fsync-heavy file
    # 1.4-1.8x slower, nothing else). 45 left no headroom, so 60.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          # Cross-OS coverage on a representative Python so every platform is
          # actually exercised without a full 3x3 runner-minute blow-up.
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # Caches downloads, not the environment: pip still resolves from
          # pyproject.toml every run. Not used by the FIPS and fresh-install
          # jobs, whose point is a cold build and a cold install.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ChromaDB is an opt-in extra as of v0.29.0; install it here so the
          # suite exercises BOTH the default turbovec backend (base dep) and the
          # opt-in chroma backend. The Fresh Install job proves the default
          # install is ChromaDB-free.
          pip install -e ".[dev,chromadb]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Upload coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
        continue-on-error: true

  # CMMC SC.L2-3.13.11 has operators turn the OS FIPS mode on, and there
  # OpenSSL refuses MD5 unless the caller passes usedforsecurity=False:
  # document ingestion (`neuralmind ingest`) crashed on such hosts. This runs
  # the whole suite with the OpenSSL FIPS provider enforced, so a new non-FIPS
  # hash fails here.
  # tests/test_fips_hash_usage.py is the static half, and runs in every job.
  fips:
    name: Test (OpenSSL FIPS provider)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The cryptography wheel bundles its own OpenSSL. Under this config the
      # two copies mix once hashlib has loaded the system one, and every
      # cryptography call fails for reasons no real host has. Built from
      # source, it links the system OpenSSL, as a distro-packaged one does on
      # a FIPS host (Rust and libssl-dev ship on the runner image).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary cryptography -e ".[dev,chromadb]"

      - name: Cache the FIPS provider build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openssl-fips
          key: openssl-fips-${{ runner.os }}-${{ hashFiles('scripts/setup_fips_openssl.sh') }}

      # After the install, so pip itself doesn't run under the FIPS config.
      - name: Enforce the OpenSSL FIPS provider
        run: |
          bash scripts/setup_fips_openssl.sh "$HOME/.cache/openssl-fips"
          echo "OPENSSL_CONF=$HOME/.cache/openssl-fips/openssl-fips.cnf" >> "$GITHUB_ENV"
          echo "OPENSSL_MODULES=$HOME/.cache/openssl-fips" >> "$GITHUB_ENV"

      - name: Run tests under the FIPS provider
        run: pytest tests/ -q --tb=short

  # NIST SP 800-218 (SSDF) PW.7 / RV.1: scan our code and our dependencies on
  # every change. CodeQL already runs through GitHub's default setup.
  security:
    name: Security scan (bandit, pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # bandit's SARIF report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the scanners
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[sarif]" pip-audit

      # High severity fails the build; a reviewed false positive carries a
      # `# nosec <id>  # <reason>` on its line. Lower severities go to the
      # Security tab below for triage rather than failing the build.
      - name: Bandit (fails on high severity)
        run: bandit -q -r neuralmind --severity-level high

      - name: Bandit report (all severities)
        if: always()
        run: bandit -q -r neuralmind -f sarif -o bandit.sarif --exit-zero

      # Fork and Dependabot PRs get a read-only token, so the upload would
      # fail there.
      - name: Upload bandit report to code scanning
        if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bandit.sarif
          category: bandit

      # Audit what users install, in its own environment so the scanners'
      # dependencies aren't in it: the default install plus the chromadb extra.
      # The only advisories ignored are the ones security/neuralmind.openvex.json
      # marks not_affected (argued in SECURITY.md), so the published VEX and
      # this gate can't disagree.
      - name: pip-audit (installed dependencies)
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/audit/bin/pip" install -e ".[chromadb]"
          # shellcheck disable=SC2046  # the flags must split into words
          PIPAPI_PYTHON_LOCATION="$RUNNER_TEMP/audit/bin/python" \
            pip-audit --progress-spinner off --skip-editable $(python scripts/vex_ignores.py)

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Pinned: the baseline lists what this version reports, and a new
          # mypy release can add or drop errors. Bump it and the baseline
          # (check_mypy_baseline.py --update) in the same change.
          pip install "mypy==2.4.0"

      # A ratchet, not a clean pass yet: the errors mypy reported when it
      # became a gate are listed in scripts/mypy-baseline.txt. Any error not
      # listed fails, and so does a listed one that's been fixed, until the
      # baseline is lowered with it. SSDF.md (PW.5) describes this.
      - name: Run mypy against the baseline
        run: python scripts/check_mypy_baseline.py

  fresh-install:
    name: Fresh Install (${{ matrix.os }}, Python ${{ matrix.python-version }}${{ matrix.mcp-spec && format(', mcp{0}', matrix.mcp-spec) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          # macOS shares the bash + venv bin/ layout the smoke steps assume, so
          # they run as-is. Windows fresh-install needs Scripts/ venv path
          # handling — tracked as a follow-up.
          - os: macos-latest
            python-version: '3.12'
          # The MCP server supports both SDK lines (1.x decorators, 2.x
          # constructor callbacks). The default legs resolve the latest 2.x;
          # this leg pins the 1.x line so a change that only works on one of
          # them fails here. See scripts/mcp_stdio_smoke.py.
          - os: ubuntu-latest
            python-version: '3.12'
            mcp-spec: '<2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install into fresh venv (no dev extras, no editable)
        run: |
          python -m venv .smoke
          source .smoke/bin/activate
          pip install --upgrade pip
          pip install .
          if [ -n "${{ matrix.mcp-spec }}" ]; then
            pip install "mcp${{ matrix.mcp-spec }}"
            python -c "import mcp, importlib.metadata as m; print('mcp', m.version('mcp'))"
          fi

      - name: pip check
        run: |
          source .smoke/bin/activate
          pip check

      - name: Import smoke test
        run: |
          source .smoke/bin/activate
          # Run from outside the checkout. `python -c` puts the working
          # directory first on sys.path, so from the repo root `import
          # neuralmind` loads ./neuralmind/ instead of the wheel installed
          # above, and a module or data file missing from the wheel would still
          # pass. Python 3.10 has no -P to switch that off. The next two steps
          # do the same; the stdio round-trip's script handles it itself.
          cd "$RUNNER_TEMP"
          # NOTE: do NOT import neuralmind.embedder here — it is the ChromaDB
          # backend (top-level `import chromadb`), which is an opt-in extra as of
          # v0.29.0. The default install must work without it.
          python -c "
          import os, sysconfig
          import neuralmind
          # The interpreter's own install dirs, not a 'site-packages' substring:
          # Debian-family Pythons install to dist-packages.
          origin = os.path.realpath(neuralmind.__file__)
          roots = [os.path.realpath(p) for p in (sysconfig.get_path(k) for k in ('purelib', 'platlib')) if p]
          assert any(origin.startswith(root + os.sep) for root in roots), (origin, roots)
          import neuralmind.cli
          import neuralmind.core
          import neuralmind.config
          import neuralmind.compressors
          import neuralmind.hooks
          import neuralmind.backend_manager
          "

      - name: ChromaDB-free default install assertions (v0.29.0)
        run: |
          source .smoke/bin/activate
          cd "$RUNNER_TEMP"  # test the wheel, not ./neuralmind/ (see the import smoke test)
          # The default install must be ChromaDB-free and resolve to turbovec.
          python -c "
          import importlib.util as u
          assert u.find_spec('chromadb') is None, 'default install must not pull ChromaDB'
          assert u.find_spec('turbovec') is not None, 'turbovec must be a base dependency'
          from neuralmind.backend_manager import resolve_backend, turbovec_available
          assert turbovec_available(), 'turbovec stack must be importable on a base install'
          assert resolve_backend('auto') == 'turbovec', 'auto must resolve to turbovec by default'
          "
          # Selecting the chroma backend without the extra must raise an
          # actionable error, not an opaque ModuleNotFoundError.
          python -c "
          from neuralmind.backend_manager import create_backend
          try:
              create_backend('graph', '.')
          except ModuleNotFoundError as e:
              assert 'neuralmind[chromadb]' in str(e), e
          else:
              raise SystemExit('expected a ModuleNotFoundError with an install hint')
          "

      - name: MCP bundling smoke test
        run: |
          source .smoke/bin/activate
          cd "$RUNNER_TEMP"  # test the wheel, not ./neuralmind/ (see the import smoke test)
          # The whole point of v0.5.0 is that `pip install neuralmind`
          # (no extras) gives a working MCP server out of the box.
          # Catch packaging regressions before they ship to PyPI.
          python -c "import mcp; import mcp.server; import mcp.types"
          python -c "from neuralmind.mcp_server import MCP_AVAILABLE; assert MCP_AVAILABLE, 'MCP SDK not importable from base install'"
          command -v neuralmind-mcp >/dev/null || { echo 'neuralmind-mcp not on PATH'; exit 1; }

      - name: MCP stdio round-trip (initialize / tools/list / tools/call)
        run: |
          source .smoke/bin/activate
          # Importing the module is not starting the server: mcp 2.0.0 removed
          # the decorator API and `neuralmind-mcp` crashed on every fresh
          # install for three weeks while the step above stayed green. This
          # spawns the real entry point and speaks JSON-RPC to it:
          # --entry-point runs the venv's `neuralmind-mcp` console script, the
          # command MCP clients are configured with, so a [project.scripts]
          # entry naming a missing function fails here (`command -v` above
          # only finds the file). The smoke script starts the server outside
          # the checkout, and --require-wheel fails the step unless that
          # server imports neuralmind from the venv's site-packages rather
          # than ./neuralmind/.
          python scripts/mcp_stdio_smoke.py --require-wheel --entry-point

      - name: CLI smoke test
        run: |
          source .smoke/bin/activate
          neuralmind --help

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          # twine's metadata validation is backed by `packaging`. The runner's
          # preinstalled packaging lags behind the Metadata-Version that
          # hatchling now emits (2.5), so `twine check` fails with
          # "Invalid distribution metadata: '2.5' is not a valid metadata
          # version". packaging >= 26.0 is the first release that recognises
          # Metadata-Version 2.5; pin the floor rather than upgrading to
          # latest so the job stays reproducible.
          pip install twine "packaging>=26"
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
