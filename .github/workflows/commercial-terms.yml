name: Commercial terms consistency

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for release-please's branch, whose GITHUB_TOKEN pushes
  # can't fire pull_request workflows — see ci.yml (#98).
  workflow_dispatch:
  # Required checks must also run in a merge queue (see ci.yml).
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: commercial-terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: All surfaces agree with commercial-terms.json
        run: python3 scripts/check_commercial_terms.py
