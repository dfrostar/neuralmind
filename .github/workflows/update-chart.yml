name: Refresh benchmark chart

# Regenerates docs/images/benchmark_chart.png from the latest measured
# numbers and commits it back to main. Runs weekly + on manual dispatch
# to avoid creating commit noise on every merge.
#
# Guarded against CI loops via paths-ignore and a [skip ci] tag on the
# auto-commit — the benchmark workflow will not re-trigger from this.

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Two jobs, so that no installed package ever runs beside the deploy key that
# can push to main. `refresh` installs and runs the benchmark with a read-only
# token; `commit` holds the key and runs only git and the pinned actions
# below, committing the one chart `refresh` produced.

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install . tiktoken matplotlib "graphifyy==0.9.5" -c requirements-pinned.txt

      - name: Pre-fetch tiktoken vocab
        continue-on-error: true
        run: |
          python -c "
          import tiktoken
          for name in ('o200k_base', 'cl100k_base'):
              try:
                  tiktoken.get_encoding(name).encode('probe')
                  print(f'[tiktoken] {name} OK')
              except Exception as e:
                  print(f'[tiktoken] {name} FAILED: {e}')
          "

      - name: Build fixture knowledge graph
        run: |
          graphify update tests/fixtures/sample_project
          neuralmind build tests/fixtures/sample_project --force

      - name: Run benchmark + generate chart
        run: |
          python -m tests.benchmark.run
          python -m tests.benchmark.multi_model
          python scripts/generate_chart.py

      - name: Hand the chart to the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-chart
          path: docs/images/benchmark_chart.png
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push to main with the write-enabled deploy key. A deploy key is the
          # only bypass a ruleset requiring PRs and passing CI can grant here
          # (GitHub won't accept the Actions app as a bypass actor on a
          # personal-account repo), so this push keeps working once main
          # requires them; today it doesn't (docs/compliance/SSDF.md, PS.1).
          # Unset (forks), checkout falls back to GITHUB_TOKEN as before.
          ssh-key: ${{ secrets.MAIN_PUSH_DEPLOY_KEY }}

      - name: Fetch the chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-chart
          path: docs/images

      - name: Commit chart if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/benchmark_chart.png
          if git diff --cached --quiet; then
            echo "Chart unchanged — nothing to commit."
            exit 0
          fi
          # [skip ci] prevents this commit from re-triggering the PR
          # benchmark workflow, which would be wasteful on main.
          git commit -m "docs: refresh benchmark chart [skip ci]"
          git push
