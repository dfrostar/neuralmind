name: Docker Publish (GHCR)

# Auto-build the repo-root Dockerfile and push to GHCR on every tag push.
# Tracks issue #120. The image lives at:
#   ghcr.io/dfrostar/neuralmind:vX.Y.Z
#   ghcr.io/dfrostar/neuralmind:latest        (the newest stable release)
#
# Multi-platform (linux/amd64 + linux/arm64). GITHUB_TOKEN has GHCR write
# access on private GitHub-hosted runners with the `packages: write`
# permission below — no separate registry login required.
#
# Triggered on the same `v*` tag push that fires release.yml, so the
# image lands alongside the PyPI publish without a separate dispatch.
#
# validate-version (shared with release.yml and sbom.yml via
# _validate-release-tag.yml) gates the actual build: this workflow runs
# independently of release.yml's own validate-version job — GitHub Actions
# has no cross-workflow `needs:` — so without its own gate, an orphaned or
# manifest-mismatched tag that release.yml correctly rejects would still
# get a GHCR image built and tagged `latest` here. See CONTRIBUTING.md's
# "Release-please troubleshooting" for what this actually catches.
#
# Tag/label generation uses docker/metadata-action so:
#   - the image name is lowercased (GHCR rejects uppercase, and a
#     future repo rename or fork with mixed case wouldn't fail the push)
#   - the build pushes only the version tag; the move-latest job then points
#     `:latest` at the newest stable release's image (the highest exact
#     vX.Y.Z), so neither a pre-release nor a rebuild of an older version
#     becomes the default `:latest` that `docker pull` resolves to.
#
# A tag push runs the workflow file *at that tag's commit*, so re-pushing a
# tag cut before this guard existed still runs the old, unguarded copy. Only
# a tag ruleset (Settings → Rules) that restricts creating `v*` tags stops
# that.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build the image for (e.g., v0.9.0).'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-version:
    name: Validate Tag vs Package Version
    uses: ./.github/workflows/_validate-release-tag.yml
    with:
      # Not ${{ env.RELEASE_TAG }} -- `env` is not an available context in a
      # reusable-workflow `with:` block, and using it there invalidates the
      # entire workflow file. See release.yml's copy of this note.
      release_tag: ${{ inputs.tag || github.ref_name }}

  build-and-push:
    name: Build + push multi-platform image
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # for cosign/sigstore in a later iteration
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU (cross-arch emulation for arm64 builds on amd64 runners)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (lowercased name + smart tagging)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=raw,value=${{ env.RELEASE_TAG }} → :v0.9.0 from RELEASE_TAG.
          # This works for BOTH push:tag (RELEASE_TAG = github.ref_name)
          # AND workflow_dispatch (RELEASE_TAG = inputs.tag). The earlier
          # `type=ref,event=tag` form only fired on push:tag, so workflow-
          # dispatched runs produced only `:latest` with no version tag.
          # Only the immutable version tag is pushed here; the move-latest
          # job below points :latest at the newest release afterwards.
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.title=NeuralMind
            org.opencontainers.image.description=Semantic code intelligence for AI coding agents — 12-50× token reduction.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=MIT AND LicenseRef-NeuralMind-Commercial
          flavor: |
            latest=false

      - name: Build + push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache so subsequent builds reuse layers
          # across releases instead of rebuilding the wheel pre-download
          # from scratch every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-pull:
    name: Verify image pulls + neuralmind and neuralmind-mcp run
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Only for scripts/mcp_stdio_smoke.py, at the tag the image was built
      # from. Tags before v4.12.0 have no --entry-point flag, so dispatching
      # this workflow for one fails the smoke test below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: scripts

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull + smoke-test the version-tagged image
        env:
          IMAGE_TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          set -euo pipefail
          # The build pushes one ref, the version tag.
          IMAGE="$(printf '%s\n' "${IMAGE_TAGS}" | head -n1)"
          echo "Pulling ${IMAGE}"
          docker pull "${IMAGE}"
          echo "Running neuralmind --help"
          docker run --rm "${IMAGE}" neuralmind --help
          # --help never starts the MCP server. This runs the smoke script with
          # the image's python, fed on stdin so it needs no bind mount, and
          # --entry-point has it start the `neuralmind-mcp` installed next to
          # that python (the command in the Dockerfile's usage notes) and
          # drive initialize / tools/list / tools/call over stdio. An image
          # whose MCP server crashes on startup fails here, so this run
          # doesn't move :latest to it.
          echo "Running neuralmind-mcp over stdio"
          docker run -i --rm "${IMAGE}" python - --entry-point \
            < "${GITHUB_WORKSPACE}/scripts/mcp_stdio_smoke.py"

  # :latest follows the newest stable release, not whichever version was built
  # last. Rebuilding an older tag (a dispatch for v4.7.0, or an old tag pushed
  # again) used to move :latest back to it: on 2026-10-06 a re-pushed v1.16.0
  # left `docker pull …:latest` serving v1.16.0. This job runs after the
  # pushed image passed its smoke test, one run at a time, and re-reads the
  # tags just before it acts, so overlapping releases can't finish out of
  # order and leave :latest on the older one. Whichever run gets here points
  # :latest at the image of the highest exact vX.Y.Z tag that already has one
  # (never a pre-release), so it converges on the newest release.
  move-latest:
    name: Point :latest at the newest release
    needs: [build-and-push, verify-pull]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Point :latest at the newest stable release's image
        env:
          IMAGE_TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          set -euo pipefail
          built="$(printf '%s\n' "${IMAGE_TAGS}" | head -n1)"
          image="${built%:*}"
          # awk, not grep: no match is an empty list, not a failed pipeline.
          newest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/||' \
            | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' \
            | sort -V | tail -n1)"
          if [ -z "${newest}" ]; then
            echo "::notice title=:latest left alone::no vX.Y.Z tag on the remote."
            exit 0
          fi
          if ! docker buildx imagetools inspect "${image}:${newest}" >/dev/null 2>&1; then
            echo "::notice title=:latest left alone::${newest} has no image yet; its own run moves :latest when it finishes."
            exit 0
          fi
          docker buildx imagetools create --tag "${image}:latest" "${image}:${newest}"
          echo "::notice title=:latest moved::${image}:latest now points at ${newest} (this run built ${RELEASE_TAG})."
