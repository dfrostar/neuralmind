name: NeuralMind CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Manual trigger for release-please's branch, whose GITHUB_TOKEN pushes
  # can't fire pull_request workflows — see ci.yml (#98).
  workflow_dispatch:

# The composite action posts its summary as a PR comment; the default
# GITHUB_TOKEN here is read-only, which made that step 403 and fail the
# whole check even when compliance itself passed.
permissions:
  contents: read
  pull-requests: write

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: NeuralMind CI Compliance Check
        uses: ./.github/actions/neuralmind-ci
        with:
          framework: all
          diff: origin/${{ github.base_ref || 'main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-warning: false
