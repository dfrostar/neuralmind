name: NeuralMind CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NeuralMind CI Compliance Check
        uses: ./.github/actions/neuralmind-ci
        with:
          framework: all
          diff: origin/${{ github.base_ref || 'main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-warning: false
