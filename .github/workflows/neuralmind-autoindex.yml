name: NeuralMind Auto-Index

# Rebuilds the NeuralMind code graph on every push to the default branch and
# caches the result so teammates (and agents) always have a warm index ready.
#
# Two outputs ship from each run:
#   1. The .neuralmind/ cache is stored under the GitHub Actions cache key —
#      next build skips unchanged embeddings (hash-gated incremental update).
#   2. .neuralmind-team-memory.json is committed back when it changes, so a
#      fresh `git clone` starts with the team's earned synapse intuition already
#      in place (same as `neuralmind memory publish` on your laptop, but fully
#      automated).
#
# Usage: copy this file into .github/workflows/ and push. No secrets needed —
# NeuralMind is 100% local; nothing is sent to an external service.
#
# Optional env vars (set as repo/environment secrets or vars):
#   NEURALMIND_BYPASS=1        skip context compression (index only)
#   NEURALMIND_TEAM_MEMORY=0   disable the auto-commit of team memory

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force:
        description: "Force full re-index (skip change detection)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

# Two jobs, so that no installed package ever runs beside the deploy key that
# can push to main. `build` installs NeuralMind and its dependencies and runs
# them with a read-only token; `commit` holds the key and runs only git and
# the pinned actions below, committing the one file `build` produced.

jobs:
  autoindex:
    name: Build NeuralMind index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history so the watcher can detect changed files
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Restore NeuralMind index cache
        id: cache-neuralmind
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .neuralmind/
          # Key changes whenever any source file changes — forces re-index
          # only when something actually changed, matching NeuralMind's own
          # hash-gated incremental update logic.
          key: neuralmind-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.ts', '**/*.tsx', '**/*.go', '**/*.rs', '**/*.java', '**/*.cs', '**/*.rb', '**/*.php', '**/*.c', '**/*.cpp', '**/*.h') }}
          restore-keys: |
            neuralmind-${{ runner.os }}-

      - name: Install NeuralMind
        # NeuralMind from the checkout rather than the newest release on PyPI,
        # with the dependency versions requirements-pinned.txt names. A copy of
        # this workflow in another repository should pin an exact version
        # instead (`pip install "neuralmind==X.Y.Z"`).
        run: |
          python -m pip install --upgrade pip
          pip install . -c requirements-pinned.txt

      - name: Build index
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            neuralmind build . --force
          else
            neuralmind build .
          fi

      - name: Export team memory snapshot
        # Writes .neuralmind-team-memory.json with the earned synapse graph so
        # teammates auto-inherit it on their next build.
        run: neuralmind memory export --output .neuralmind-team-memory.json
        continue-on-error: true   # non-fatal if memory store is cold

      - name: Hand the snapshot to the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: team-memory
          path: .neuralmind-team-memory.json
          include-hidden-files: true   # the file name starts with a dot
          if-no-files-found: ignore
          retention-days: 1

  commit:
    name: Commit team memory snapshot
    needs: autoindex
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit .neuralmind-team-memory.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push to main with the write-enabled deploy key. A deploy key is the
          # only bypass a ruleset requiring PRs and passing CI can grant here
          # (GitHub won't accept the Actions app as a bypass actor on a
          # personal-account repo), so this push keeps working once main
          # requires them; today it doesn't (docs/compliance/SSDF.md, PS.1).
          # Unset (forks), checkout falls back to GITHUB_TOKEN as before.
          ssh-key: ${{ secrets.MAIN_PUSH_DEPLOY_KEY }}

      - name: Fetch the snapshot
        id: snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: team-memory
          path: .
        continue-on-error: true   # no artifact when the export above failed

      - name: Commit team memory snapshot
        # Only commits when .neuralmind-team-memory.json actually changed.
        if: steps.snapshot.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update NeuralMind team memory snapshot [skip ci]"
          file_pattern: ".neuralmind-team-memory.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
        # No continue-on-error: a rejected push fails the job. It used to pass
        # silently, so a ruleset rejection (no MAIN_PUSH_DEPLOY_KEY) went unseen.
