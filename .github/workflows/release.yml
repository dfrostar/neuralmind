name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g., v0.5.3). The tag MUST already exist in the repo.'
        required: true
        type: string

# RELEASE_TAG is the canonical "what are we releasing" value for every job
# below. On a tag push (github.ref_name == 'v0.5.3') it derives from the
# ref; on manual workflow_dispatch it comes from the user-supplied input.
# This lets us recover when release-please cuts a tag with GITHUB_TOKEN
# (which doesn't fire push:tags workflows) by re-running this workflow
# manually against the existing tag — see issue #98.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-version:
    name: Validate Tag vs Package Version
    uses: ./.github/workflows/_validate-release-tag.yml
    with:
      # Duplicates the RELEASE_TAG env expression above rather than reusing it:
      # `env` is NOT an available context in `jobs.<id>.with.<input>` (only
      # github, needs, strategy, matrix, inputs, vars are). Referencing it
      # there makes the whole workflow file invalid, so Actions rejects it at
      # startup -- no jobs, no logs, and a release that silently never
      # publishes. That is exactly what happened to v3.10.0.
      release_tag: ${{ inputs.tag || github.ref_name }}

  smoke-test:
    name: Smoke Test
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke test (import + CLI)
        run: |
          python -c "import neuralmind; print(f'neuralmind {neuralmind.__version__}')"
          neuralmind --version
          neuralmind --help > /dev/null
          echo "OK: package imports and CLI works"

  build:
    name: Build Package
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          # Fail fast on metadata problems here, before the publish job
          # uploads to PyPI. twine's validation is backed by `packaging`;
          # the runner's preinstalled packaging can lag behind the
          # Metadata-Version hatchling emits (2.5). packaging >= 26.0 is the
          # first release that recognises Metadata-Version 2.5; pin the floor
          # rather than upgrading to latest to keep releases reproducible.
          pip install twine "packaging>=26"
          twine check dist/*

      - name: Store build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/neuralmind
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password needed - uses trusted publishing via OIDC
        with:
          # A validate-version repair (retagging an orphaned tag, see
          # CONTRIBUTING.md's "Release-please troubleshooting") re-fires this
          # whole workflow against a tag whose version may already be on
          # PyPI. Without this, that re-run fails here with "400: File
          # already exists" even though every check above it correctly
          # passed. skip-existing makes an already-published version a
          # successful no-op instead — the actual fix in that scenario is
          # the tag repair itself, not a new PyPI upload.
          skip-existing: true

  smoke-test-pypi:
    name: Smoke Test PyPI Package
    needs: publish-pypi
    runs-on: ubuntu-latest
    # The install below can wait up to 20 minutes for PyPI's index.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Only for scripts/mcp_stdio_smoke.py, at the tag this run released. Tags
      # before v4.12.0 have no --entry-point flag, so dispatching this workflow
      # for one fails the smoke test below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Smoke test published package from PyPI
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "Testing neuralmind==${VERSION}"
          # Run from outside the checkout: `python -c` puts the working
          # directory first on sys.path, so if the checkout ever held
          # ./neuralmind/ it would be imported instead of the package installed
          # from PyPI (Python 3.10 has no -P to switch that off).
          cd "${RUNNER_TEMP}"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # A new upload can be missing from PyPI's simple index for minutes:
          # v4.6.0 was uploaded at 01:27:41 UTC, still not installable at
          # 01:30:56, and installable by 01:33:44. The index is served with
          # max-age=600 and pip caches it for that long, so a retry that uses
          # pip's cache keeps seeing the stale page. Retry without the cache,
          # every 30s, for up to 20 minutes.
          deadline=$((SECONDS + 1200))
          until pip install --no-cache-dir "neuralmind==${VERSION}"; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Failed to install neuralmind==${VERSION} from PyPI within 20 minutes."
              exit 1
            fi
            echo "neuralmind==${VERSION} not installable from PyPI yet; retrying in 30s."
            sleep 30
          done
          INSTALLED_VERSION="$(python -c "import neuralmind; print(neuralmind.__version__)")"
          if [ "${INSTALLED_VERSION}" != "${VERSION}" ]; then
            echo "Error: Version mismatch. Expected ${VERSION}, got ${INSTALLED_VERSION}."
            exit 1
          fi
          neuralmind --help
          # --help never starts the MCP server. This runs the venv's
          # `neuralmind-mcp` console script, the command MCP clients are
          # configured with, and drives initialize / tools/list / tools/call
          # over stdio, so an entry point naming a missing function, a module
          # left out of the wheel, or an MCP SDK the server can't start on
          # fails here and holds back the GitHub Release. --require-wheel
          # fails unless that server imports neuralmind from the venv's
          # site-packages.
          python "${GITHUB_WORKSPACE}/scripts/mcp_stdio_smoke.py" --require-wheel --entry-point

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/neuralmind
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # explicit, not just masked by continue-on-error below
        continue-on-error: true  # Don't fail if version already exists

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi, smoke-test-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attach dist artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          echo "Tag: ${TAG}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — preserving title/body, attempting artifact upload."
            if gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber; then
              echo "Artifacts attached."
            else
              # Published Releases are immutable on this repo; there is no API path to add assets after publish.
              echo "::warning title=GitHub Release artifacts not attached::Could not upload dist/* to ${TAG} (the Release is likely immutable). PyPI is the canonical install source: https://pypi.org/project/neuralmind/${TAG#v}/"
            fi
          else
            echo "Release ${TAG} does not exist — creating with artifacts attached."
            NOTES_FILE="docs/releases/RELEASE_NOTES_${TAG}.md"
            if [ -f "${NOTES_FILE}" ]; then
              gh release create "${TAG}" dist/* \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${TAG}" \
                --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG}" dist/* \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${TAG}" \
                --generate-notes
            fi
          fi
