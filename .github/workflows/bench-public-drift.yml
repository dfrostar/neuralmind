name: Public benchmark drift check

# Regenerates the public benchmark on every PR and push to main, then
# diffs the fresh numbers against the committed bench/public/results.json
# (machine-readable; docs/benchmarks/public.md is the human-readable copy).
# Fails if any repo's recall drifts by more than 5 points or its mean
# tokens/query by more than 10%, or if a committed number goes unmeasured —
# the same pattern ci-benchmark.yml uses for the reference-fixture gates,
# applied to the public corpus so a stale snapshot can't sit uncorrected.
# Comparison logic: scripts/check_public_bench_drift.py.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-benchmark-drift:
    runs-on: ubuntu-latest
    env:
      NEURALMIND_ORT_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Identical software has landed in two exact output states on different
      # runners (docs/benchmarks/public.md, "How exactly a re-run reproduces").
      # Log the hardware so a drift failure can be told apart from that split.
      - name: Record runner CPU
        run: |
          echo "cpu: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//'); avx512f: $(grep -qw avx512f /proc/cpuinfo && echo yes || echo no); simd: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512.*|amx.*)$' | sort | paste -sd' ' -); nproc: $(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install NeuralMind + benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . tiktoken

      # --out bench/public overwrites the committed results.json, so keep a
      # copy of the committed numbers to diff the fresh run against.
      - name: Snapshot committed numbers
        run: cp bench/public/results.json "$RUNNER_TEMP/committed-results.json"

      # The default shell has no pipefail, so without it this step took tee's
      # exit status: a crashed run passed here and only failed later, as an
      # unreadable public-report.json in the diff step.
      - name: Run the public benchmark
        id: bench
        run: |
          set -o pipefail
          python -m evals.public.run --json --out bench/public | tee public-report.json

      - name: Diff against committed numbers
        id: diff
        run: |
          python scripts/check_public_bench_drift.py \
            --fresh public-report.json \
            --committed "$RUNNER_TEMP/committed-results.json"

      - name: Upload fresh results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-benchmark-drift
          path: |
            public-report.json
            bench/public/results.json
            bench/public/report.md

      # Compression benchmark: its Read and Grep arms need these same pinned
      # checkouts (.bench-work, the public run's default) and an index per
      # repo, so only this job can recompute them; the Bash arm is redone
      # offline by tests/test_compression_benchmark.py. Every call in the
      # fresh run must match bench/compression/results.json exactly (see
      # evals/compression/drift.py). Runs even if the public check failed.
      - name: Run the compression benchmark
        id: compression
        if: ${{ !cancelled() }}
        run: python -m evals.compression.run --work-dir .bench-work --out "$RUNNER_TEMP/compression"

      - name: Diff against committed compression results
        if: ${{ !cancelled() && steps.compression.outcome == 'success' }}
        run: python -m evals.compression.drift --fresh "$RUNNER_TEMP/compression/results.json"

      - name: Upload fresh compression results
        if: ${{ !cancelled() && steps.compression.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: compression-benchmark-drift
          path: ${{ runner.temp }}/compression/
