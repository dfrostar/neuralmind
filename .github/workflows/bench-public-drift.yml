name: Public benchmark drift check

# Regenerates the public benchmark on every PR and push to main, then
# diffs the fresh numbers against the committed bench/public/results.json
# (machine-readable; docs/benchmarks/public.md is the human-readable copy).
# Fails if any repo's recall drifts by more than 5 points or its mean
# tokens/query by more than 10%, or if a committed number goes unmeasured —
# the same pattern ci-benchmark.yml uses for the reference-fixture gates,
# applied to the public corpus so a stale snapshot can't sit uncorrected.
# Comparison logic: scripts/check_public_bench_drift.py.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-benchmark-drift:
    runs-on: ubuntu-latest
    env:
      NEURALMIND_ORT_THREADS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NeuralMind + benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . tiktoken

      # --out bench/public overwrites the committed results.json, so keep a
      # copy of the committed numbers to diff the fresh run against.
      - name: Snapshot committed numbers
        run: cp bench/public/results.json "$RUNNER_TEMP/committed-results.json"

      - name: Run the public benchmark
        id: bench
        run: |
          python -m evals.public.run --json --out bench/public | tee public-report.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Diff against committed numbers
        id: diff
        run: |
          python scripts/check_public_bench_drift.py \
            --fresh public-report.json \
            --committed "$RUNNER_TEMP/committed-results.json"

      - name: Upload fresh results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-benchmark-drift
          path: |
            public-report.json
            bench/public/results.json
            bench/public/report.md
